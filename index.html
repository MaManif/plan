<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appli lycéens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl/maplibre-gl.css">
<style>
:root{--bg:#ffd23f;--fg:#111;--card:#111;--cardfg:#ffd23f;--line:#111;
--urgence:#d90429;--blanc:#fff;
--ombre:4px 4px 0 var(--line);
--t-rapide:.15s;--t-ecran:.25s;--t-fiche:.3s;--courbe:ease-out;
interpolate-size:allow-keywords;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#ffd23f;--card:#ffd23f;--cardfg:#111;--line:#ffd23f}}
:root[data-theme="dark"]{--bg:#111;--fg:#ffd23f;--card:#ffd23f;--cardfg:#111;--line:#ffd23f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.5 "Archivo",system-ui,sans-serif;padding-bottom:calc(var(--navh,5.5rem) + 16px)}
main{max-width:560px;margin:auto;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
section{display:none}
section.on{display:block;animation:entree var(--t-ecran) var(--courbe)}
@keyframes entree{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Titres */
h1{font:400 2.75rem/1 "Anton",Impact,"Arial Black",sans-serif;text-transform:uppercase;margin:8px 0 24px}
h2{font:800 1.25rem/1.25 "Archivo",system-ui,sans-serif;text-transform:uppercase;margin:32px 0 8px}

/* Informations : on lit (coins presque carres, trait de 3 px, pas d'ombre) */
.vide{border:3px dashed var(--line);border-radius:6px;padding:24px 16px;text-align:center;font-size:1.25rem;font-weight:800}
.vide small{display:block;font-size:.875rem;font-weight:400;margin-top:8px}
.item{border:3px solid var(--line);border-radius:6px;padding:16px;margin:8px 0;font-size:1.25rem;font-weight:800;line-height:1.25}
.item small{display:block;font-size:.875rem;font-weight:400;line-height:1.5;margin-top:4px}
details{border:3px solid var(--line);border-radius:6px;margin:8px 0}
summary{position:relative;min-height:44px;padding:16px 56px 16px 16px;cursor:pointer;list-style:none;font-size:1.25rem;font-weight:800;line-height:1.25}
summary small{display:block;font-size:.875rem;font-weight:400;line-height:1.5;margin-top:4px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:16px;top:14px;font-size:1.25rem;font-weight:800;line-height:1}
details[open] summary::after{content:"−"}
details>div{padding:0 16px 16px;font-size:1rem;font-weight:400}
details::details-content{block-size:0;overflow:hidden;transition:block-size var(--t-fiche) var(--courbe),content-visibility var(--t-fiche) var(--courbe) allow-discrete}
details[open]::details-content{block-size:auto}
details a{color:inherit;font-weight:800;text-decoration:underline}
details ul{margin:0;padding-left:24px}
details li{margin:8px 0}
.src{font-size:.875rem;margin:16px 0 0;padding-top:8px;border-top:1px solid currentColor}
.tag{display:inline-block;font-size:.875rem;font-weight:800;line-height:1.5;border:2px solid currentColor;border-radius:6px;padding:0 8px;margin-right:8px;vertical-align:1px;white-space:nowrap}
.agehelp{font-size:.875rem;font-weight:400;margin:0 0 8px}
body[data-age="15"] [data-a]:not([data-a~="15"]),body[data-age="17"] [data-a]:not([data-a~="17"]),body[data-age="18"] [data-a]:not([data-a~="18"]){display:none}

/* Urgences : rouge plein, texte blanc, le numero reste ecrit */
details a[href="tel:17"],details a[href="tel:15"],details a[href="tel:112"],details a[href="tel:114"],details a[href="tel:119"]{
 display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 16px;margin:4px 8px 4px 0;
 background:var(--urgence);color:var(--blanc);border-radius:999px;text-decoration:none;font-weight:800;box-shadow:var(--ombre);
 transition:transform var(--t-rapide) var(--courbe),box-shadow var(--t-rapide) var(--courbe)}

/* Boutons : on touche (pastille, ombre dure qui s'enfonce) */
.age{display:flex;gap:8px;margin:0 0 8px;padding:0 4px 4px 0}
.age button,.btn,.chips button,.zoom button,.go,nav button{font:inherit;font-size:.875rem;font-weight:800;line-height:1.2;min-height:44px;border:3px solid var(--line);border-radius:999px;cursor:pointer;
 transition:transform var(--t-rapide) var(--courbe),box-shadow var(--t-rapide) var(--courbe)}
.age button{flex:1;min-width:0;padding:4px 8px;background:transparent;color:var(--fg);box-shadow:var(--ombre)}
.age button[aria-checked=true]{background:var(--card);color:var(--cardfg)}
.btn{display:block;width:calc(100% - 4px);margin:16px 4px 0 0;padding:8px 16px;font-size:1rem;background:var(--card);color:var(--cardfg);box-shadow:var(--ombre)}
.go{margin-top:16px;padding:4px 16px;background:var(--card);color:var(--cardfg);box-shadow:var(--ombre)}
label.ck{display:flex;gap:16px;align-items:center;min-height:44px;padding:8px 24px;margin:8px 4px 8px 0;border:3px solid var(--line);border-radius:999px;background:var(--card);color:var(--cardfg);box-shadow:var(--ombre);cursor:pointer;
 transition:transform var(--t-rapide) var(--courbe),box-shadow var(--t-rapide) var(--courbe)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--bg);flex:none}
.age button:active,.btn:active,.chips button:active,.zoom button:active,.go:active,label.ck:active,nav button[aria-selected=true]:active,
details a[href="tel:17"]:active,details a[href="tel:15"]:active,details a[href="tel:112"]:active,details a[href="tel:114"]:active,details a[href="tel:119"]:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}

/* Champ de saisie */
input[type=tel]{width:calc(100% - 4px);min-height:44px;padding:8px 24px;border:3px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font:inherit;font-size:1rem}
input::placeholder{color:var(--fg);opacity:.75}

/* Barre d'onglets */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(5rem,1fr));gap:8px;
 padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left));z-index:5}
nav button{padding:4px;background:transparent;color:var(--fg)}
nav button[aria-selected=true]{background:var(--card);color:var(--cardfg);box-shadow:var(--ombre)}

/* Carte */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 8px;padding:0 4px 8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:4px 16px;background:var(--card);color:var(--cardfg);box-shadow:var(--ombre)}
.mapbox{position:relative;height:60vh;height:max(20rem,calc(100dvh - var(--navh,5.5rem) - 15rem));border:3px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 8px;background:var(--card)}
#map{position:absolute;inset:0}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zoom button{width:44px;padding:0;font-size:1.25rem;background:var(--card);color:var(--cardfg);box-shadow:var(--ombre)}
.attrib{position:absolute;left:0;bottom:0;z-index:2;background:var(--bg);color:var(--fg);font-size:.875rem;font-weight:400;line-height:1.5;padding:0 8px;border-top:3px solid var(--line);border-right:3px solid var(--line);border-top-right-radius:6px}
.attrib a{color:inherit}
.pin{width:44px;height:44px;padding:0;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.pin::before{content:"";width:24px;height:24px;border-radius:50%;background:var(--card);border:3px solid var(--cardfg);box-shadow:var(--ombre)}
.maplibregl-popup-content{background:var(--bg);color:var(--fg);border:3px solid var(--line);border-radius:6px;box-shadow:none;padding:16px;font:400 1rem/1.5 "Archivo",system-ui,sans-serif}
.maplibregl-popup-content strong{display:block;font-size:1.25rem;font-weight:800;line-height:1.25}
.maplibregl-popup-content .pp{font-size:.875rem;margin-top:8px}
.maplibregl-popup-tip{display:none}
.maplibregl-popup-close-button{width:44px;height:44px;font-size:1.25rem;color:var(--fg)}

/* Clavier : contour toujours visible */
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

/* Respect du reglage "reduire les animations" */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main>

<section id="carte" class="on" role="tabpanel" aria-labelledby="t-carte">
<h1>Carte</h1>
<div class="chips" id="chips" role="group" aria-label="Aller à une ville"></div>
<div class="mapbox"><div id="map" role="application" aria-label="Carte"></div>
<div class="zoom"><button type="button" id="zin" aria-label="Zoomer">+</button><button type="button" id="zout" aria-label="Dézoomer">−</button></div>
<div class="attrib"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a></div></div>
<p class="agehelp" id="maphelp">Chargement de la carte…</p>
<div id="l-carte"></div>
</section>

<section id="agenda" role="tabpanel" aria-labelledby="t-agenda">
<h1>Agenda</h1>
<div id="l-agenda"></div>
</section>

<section id="droits" role="tabpanel" aria-labelledby="t-droits">
<h1>Droits</h1>
<div class="age" id="age" role="radiogroup" aria-label="Ton âge">
<button role="radio" aria-checked="false" data-v="15">Moins de 16 ans</button>
<button role="radio" aria-checked="false" data-v="17">16-17 ans</button>
<button role="radio" aria-checked="false" data-v="18">18 ans et +</button>
</div>
<p class="agehelp" id="agehelp"></p>
<div id="l-droits"></div>
</section>

<section id="secu" role="tabpanel" aria-labelledby="t-secu">
<h1>Sécurité</h1>
<div id="l-check"></div>
<h2>Prévenir un proche</h2>
<input id="num" type="tel" inputmode="tel" placeholder="Numéro de ton proche" aria-label="Numéro de ton proche">
<button class="btn" id="b1">Message de départ</button>
<button class="btn" id="b2">Message « bien rentré·e »</button>
</section>

</main>
<nav role="tablist" aria-label="Sections">
<button role="tab" id="t-carte" aria-controls="carte" aria-selected="true" data-t="carte">Carte</button>
<button role="tab" id="t-agenda" aria-controls="agenda" aria-selected="false" data-t="agenda">Agenda</button>
<button role="tab" id="t-droits" aria-controls="droits" aria-selected="false" data-t="droits">Droits</button>
<button role="tab" id="t-secu" aria-controls="secu" aria-selected="false" data-t="secu">Sécurité</button>
</nav>

<script>
const DATA = {
 carte: [],
 agenda: [],
 sits: [["now","En ce moment","Ces infos changent vite : regarde la date avant de t'y fier."],["rue","Dans la rue"],["inter","Si tu es interpellé·e"],["lycee","Au lycée"],["urg","Urgences"]],
 droits: [
  {sit:"rue", titre:"Avant de partir", phrase:"Écris le numéro d'un proche sur ton bras, au stylo.", maj:"7 octobre 2026", src:"SAF Seine-Saint-Denis, « En garde à vue, pas à pas » ; conseils de terrain relayés sur Instagram (@claire_nouvian) ; Café pédagogique (appel du 6 octobre)", texte:`<ul>
<li>Écris au stylo sur ton bras le numéro d'un proche, et celui d'un·e avocat·e si tu en as un·e : la police peut saisir ton téléphone.</li>
<li>Retiens le nom d'un·e avocat·e et son barreau (voir « Avocat·es mobilisé·es »).</li>
<li>Reste calme : pas de provocation, pas d'insultes (injurier un agent s'appelle un outrage), pas de dégradations, aucune violence. Ne résiste pas physiquement.</li>
<li>En garde à vue, il fait souvent froid, il n'y a pas de chaise et on dort peu : prends deux pulls (un pour te tenir chaud, un comme oreiller) et de quoi boire et manger dans ton sac.</li>
<li>Masque FFP2 et lunettes de protection : c'est un conseil souvent donné contre les gaz lacrymogènes. Mais se couvrir le visage sans motif légitime est un délit (voir « Manifester »), et un arrêté peut interdire les équipements de protection destinés à mettre en échec les moyens de la police (voir « Arrêtés de la préfecture »). Renseigne-toi avant.</li>
<li data-a="15 17">Les syndicats (CFDT, CGT, FSU, FO, UNSA), la FCPE, Amnesty et la LDH ont appelé les parents à accompagner les jeunes en manifestation, habillés en blanc pour être bien visibles.</li>
</ul>`},
  {sit:"rue", titre:"Manifester", phrase:"Tu as le droit de manifester, quel que soit ton âge.", maj:"7 octobre 2026", src:"Préfecture de police de Paris, arrêté n° 2026-01252 du 2 octobre 2026 (rappel des textes). Les autres lignes sont à vérifier", texte:`<ul>
<li>Il n'y a pas d'âge minimum pour manifester.</li>
<li>À Paris, la manifestation se déclare au préfet de police, au moins 3 jours francs et au plus 15 jours francs avant sa date.</li>
<li>Avoir organisé une manifestation non déclarée est puni de 6 mois de prison et 7 500 € d'amende : cela vise les organisateurs, pas les simples participant·es.</li>
<li>Se couvrir volontairement tout ou partie du visage, sans motif légitime, dans une manifestation (ou à ses abords) où des troubles ont lieu ou risquent d'avoir lieu est puni d'1 an de prison et 15 000 € d'amende.</li>
<li>Après les sommations de dispersion, rester sur place peut être puni.</li>
<li data-a="15 17">Prévenir un proche avant de partir est une bonne idée.</li>
</ul>`},
{sit:"now", titre:"Zones interdites autour des lycées", phrase:"Le préfet a interdit certains rassemblements, dans des zones et pour une durée limitées.", maj:"7 octobre 2026", src:"Préfecture de police de Paris, arrêté n° 2026-01252 (2 octobre) ; Pass Éducation (arrêté du 5 octobre) et Café pédagogique (autres départements). Je n'ai pas pu lire l'arrêté du 5 octobre : à confirmer", texte:`<ul>
<li><b>En clair :</b> un arrêté est une décision du préfet, valable pour des lieux et une durée précis. Il n'enlève pas le droit de manifester : il interdit les rassemblements non déclarés dans des périmètres définis rue par rue autour de certains lycées.</li>
<li><b>Paris, du 3 au 5 octobre :</b> arrêté n° 2026-01252, 25 lycées. Terminé.</li>
<li><b>Paris, depuis le 6 octobre :</b> d'après Pass Éducation, un nouvel arrêté pris le 5 octobre étend l'interdiction à 39 lycées. <b>À confirmer</b> : je n'ai ni le texte officiel ni sa date de fin.</li>
<li><b>Dans ces zones,</b> il est aussi interdit de porter sans motif légitime des armes ou objets pouvant servir d'arme, des artifices, des produits inflammables, et des équipements pour mettre en échec les moyens de la police. À Paris, une manifestation déclarée n'est pas visée par l'interdiction de rassemblement, mais l'interdiction de porter ces objets s'applique quand même.</li>
<li><b>Autres départements :</b> la Seine-Saint-Denis, les Hauts-de-Seine et le Val-de-Marne ont pris leurs propres arrêtés, valables jusqu'à la reprise des cours en présentiel. Dans les Hauts-de-Seine, l'interdiction vise les rassemblements de 5 personnes ou plus « susceptibles de troubler l'ordre public ».</li>
<li><b>Ce que tu fais :</b> regarde si ton lycée est dans la liste et quelle est la date de fin. Les périmètres exacts seront dans l'onglet Carte.</li>
<li>Un professeur de droit public cité par le Café pédagogique juge ces arrêtés flous et trop larges. Contester un arrêté est possible dans les 2 mois, mais cela ne le suspend pas.</li>
</ul>`},
  {sit:"rue", titre:"Contrôle et fouille", phrase:"Reste calme, demande le motif, et retiens le numéro RIO de l'agent.", maj:"7 octobre 2026", src:"SAF Seine-Saint-Denis ; arrêté n° 2026-01252 (fouille des bagages sur réquisition du procureur). Les autres lignes sont à vérifier", texte:`<ul>
<li>Si tu es français·e, aucune pièce d'identité n'est obligatoire sur toi, mais sans moyen de prouver qui tu es, tu peux être retenu·e jusqu'à 4 h pour vérification.</li>
<li data-a="15 17">Si tu es mineur·e, tes parents sont prévenus.</li>
<li>Tu peux demander le motif du contrôle. Ne résiste pas physiquement.</li>
<li>Sur réquisition écrite du procureur, la police peut inspecter visuellement et fouiller les bagages sur les lieux d'une manifestation et à ses abords immédiats.</li>
<li>Les agents portent un numéro d'identification (RIO) sur l'uniforme : tu peux le noter.</li>
</ul>`},
  {sit:"rue", titre:"Filmer et publier", phrase:"Filmer la police est légal, mais protège les visages de tes camarades.", maj:"7 octobre 2026", src:"SAF Seine-Saint-Denis (filmer la police est légal). Les autres lignes sont à vérifier", texte:`<ul>
<li>Filmer ou photographier une manifestation et une intervention de police dans l'espace public est légal.</li>
<li>Diffuser le visage ou l'identité d'un agent dans le but qu'on lui fasse du mal est un délit.</li>
<li>Floute les visages de tes camarades avant de publier : ces images peuvent servir contre elles et eux.</li>
<li>Les appels à la violence ou à la haine sont punis, même en ligne.</li>
</ul>`},
  {sit:"inter", titre:"Phrases à dire", phrase:"Donne ton identité, et rien d'autre.", maj:"7 octobre 2026", src:"SAF Seine-Saint-Denis, « Lycéen·ne, arrêté·e ? » ; affiche « Blocus lycéens 28-30 septembre »", texte:`<ul>
<li>Donne ton identité, et rien d'autre. Te taire, ce n'est pas avouer.</li>
<li>« Je veux un avocat. » (ou « une avocate »)</li>
<li>« Je n'ai rien à déclarer. »</li>
<li>« Je veux voir un médecin. »</li>
<li data-a="15 17">« Prévenez mes parents. »</li>
<li data-a="18">« Prévenez mon proche. » (donne un nom ou un numéro)</li>
<li>À toutes les questions : « Sur conseil de mon avocat·e, je garde le silence. »</li>
</ul>`},
  {sit:"inter", titre:"Garde à vue : tes droits", phrase:"24 h, renouvelable une fois : avocat·e, médecin, famille prévenue.", maj:"7 octobre 2026", src:"SAF Seine-Saint-Denis, « En garde à vue, pas à pas » (pour les mineur·es). Les lignes « 18 ans et + » sont à vérifier", texte:`<ul>
<li>Durée : 24 h, renouvelable une fois.</li>
<li data-a="15">De 13 à 16 ans, pas de prolongation pour un délit puni de moins de 5 ans de prison. Jamais de garde à vue avant 13 ans.</li>
<li data-a="15 17">Avocat·e : obligatoire et gratuit pour un·e mineur·e. Tu le ou la vois 30 minutes en tête-à-tête. Pas d'audition sans lui ou elle, sauf décision motivée du procureur.</li>
<li data-a="18">Avocat·e : tu y as droit, gratuit si tu n'en as pas. Ce n'est pas obligatoire, mais c'est fortement conseillé.</li>
<li>Retiens le nom de l'avocat·e et son barreau, et désigne-le ou la en garde à vue. Sans avocat·e, la police doit t'en trouver un·e (commis d'office, gratuit).</li>
<li data-a="15 17">Parents : prévenus tout de suite, ou un adulte de confiance que tu désignes. Tu peux aussi faire prévenir un proche.</li>
<li data-a="18">Tu peux faire prévenir un proche.</li>
<li data-a="15">Médecin : automatique avant 16 ans.</li>
<li data-a="17 18">Médecin : demande à en voir un·e. Même en pleine forme, c'est ton droit, et ça te protège en cas de violences. Blessé·e à l'interpellation ? Fais tout noter par le médecin.</li>
<li>Savoir pourquoi : dès le début, dans ta langue (interprète gratuit), on doit te dire ce qu'on te reproche, où, quand, et pourquoi tu es en garde à vue. La police doit te notifier tes droits.</li>
</ul>`},
  {sit:"inter", titre:"Auditions, téléphone, empreintes", phrase:"Ne signe rien sans relire. Ne donne pas ton code avant d'avoir vu ton avocat·e.", maj:"7 octobre 2026", src:"SAF Seine-Saint-Denis, « En garde à vue, pas à pas » ; conseils relayés sur Instagram (@claire_nouvian)", texte:`<ul>
<li>Ta seule obligation est de donner ton identité. Pour le reste, ne réponds ni aux questions ni aux pressions : attends ton avocat·e.</li>
<li>Ne parle pas des faits dans le fourgon ni en cellule.</li>
<li data-a="15 17">Les auditions sont filmées pour un·e mineur·e.</li>
<li>Demande à relire le procès-verbal (PV) et prends tout le temps qu'il faut. Ne signe rien sans l'avoir lu.</li>
<li>Si le PV est inexact : demande une rectification, sinon refuse de signer et écris pourquoi.</li>
<li>Téléphone : ne donne pas ton code avant d'en parler à ton avocat·e. Le refus n'est puni que dans des cas précis.</li>
<li>Empreintes et photo : les refuser peut être un délit. Demande d'abord l'avis de ton avocat·e, qui peut y assister.</li>
</ul>`},
  {sit:"inter", titre:"Après la garde à vue", phrase:"Ça ne finit pas forcément devant un juge.", maj:"7 octobre 2026", src:"Cabinets d'avocats Roquetty et Kohen (3 et 5 octobre 2026) : deux sources d'avocats, pas officielles, à faire relire", texte:`<ul>
<li>À la sortie, plusieurs issues sont possibles : classement sans suite, rappel à la loi, mesure éducative (stage de citoyenneté, réparation), ou présentation devant le procureur ou le juge des enfants (déferrement).</li>
<li data-a="15 17">Pour un·e mineur·e, la justice cherche d'abord des réponses éducatives plutôt que la prison, surtout à la première fois.</li>
<li>Note l'heure de début et de fin de ta garde à vue : ça permet de vérifier que la durée a été respectée.</li>

(function(){
 const el=$("#l-droits");
 if(!DATA.droits.length){el.innerHTML=vide("Aucune fiche pour le moment","Les fiches apparaîtront ici.");return}
 const auj=new Date().toLocaleDateString("sv-SE");
 const fin=u=>u.slice(8,10)+"/"+u.slice(5,7);
 el.innerHTML=DATA.sits.map(([k,nom,note])=>{

 }).join("");
 el.querySelectorAll("[data-a]").forEach(n=>{const t=TAGS[n.dataset.a];if(t)n.insertAdjacentHTML("afterbegin",`<span class="tag">${t}</span>`)});
})();

try{

 $("#num").value=localStorage.getItem("num")||"";

$("#b1").onclick=()=>sms(DATA.msgs.depart);

 const nav=document.querySelector("nav"),tabs=[...nav.querySelectorAll("button")];
 const maj=()=>{tabs.forEach(t=>t.tabIndex=t.getAttribute("aria-selected")==="true"?0:-1);document.documentElement.style.setProperty("--navh",nav.offsetHeight+"px")};
 tabs.forEach((t,i)=>{
  t.addEventListener("click",maj);

   if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;

<script src="lib/maplibre-gl/maplibre-gl.js"></script>
<script src="lib/pmtiles/pmtiles.js"></script>
<script src="lib/basemaps/basemaps.js"></script>
<script>
(function(){
 const aide=document.getElementById("maphelp");
 const abs=p=>new URL(p,location.href).href;
 const panne=t=>{aide.hidden=false;aide.textContent=t};
 if(typeof maplibregl==="undefined"||typeof pmtiles==="undefined"||typeof basemaps==="undefined"){panne("La carte n'a pas pu se charger. Recharge la page ; si ça continue, réessaie un peu plus tard.");return}

 // ---- Une seule carte, lue dans plusieurs fichiers (invisible pour l'utilisateur) ----
 let FICHIERS=[];const OUVERTS={};
 const aire=b=>(b[2]-b[0])*(b[3]-b[1]);
 function tuileBbox(z,x,y){
  const n=Math.pow(2,z),lon=v=>v/n*360-180,lat=v=>{const r=Math.PI-2*Math.PI*v/n;return 180/Math.PI*Math.atan(.5*(Math.exp(r)-Math.exp(-r)))};
  return [lon(x),lat(y+1),lon(x+1),lat(y)];
 }
 function choisir(z,x,y){
  const t=tuileBbox(z,x,y);
  const c=FICHIERS.filter(f=>(f.maxzoom==null?15:f.maxzoom)>=z&&f.bbox[0]<t[2]&&f.bbox[2]>t[0]&&f.bbox[1]<t[3]&&f.bbox[3]>t[1]);
  c.sort((a,b)=>z<=9?aire(b.bbox)-aire(a.bbox):aire(a.bbox)-aire(b.bbox));
  return c;
 }
 const ouvrir=nom=>OUVERTS[nom]||(OUVERTS[nom]=new pmtiles.PMTiles(abs("cartes/"+nom)));
 async function chargerTuile(params){
  const m=params.url.match(/^multi:\/\/(\d+)\/(\d+)\/(\d+)/);
  if(!m)return{data:new Uint8Array()};
  const z=+m[1],x=+m[2],y=+m[3];
  for(const f of choisir(z,x,y)){
   try{const r=await ouvrir(f.file).getZxy(z,x,y);if(r&&r.data)return{data:new Uint8Array(r.data)}}catch(e){}
  }
  return{data:new Uint8Array()};
 }

 // ---- Theme clair / sombre, comme le reste de l'appli ----
 const sombre=()=>{const t=document.documentElement.dataset.theme;return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches)};
 const style=()=>{const th=sombre()?"dark":"light";return{
  version:8,
  glyphs:abs("assets/fonts/")+"{fontstack}/{range}.pbf",
  sprite:abs("assets/sprites/v4/"+th),
  sources:{protomaps:{type:"vector",tiles:["multi://{z}/{x}/{y}"],minzoom:0,maxzoom:15}},
  layers:basemaps.layers("protomaps",basemaps.namedFlavor(th),{lang:"fr"})}};

 // ---- Raccourcis vers les villes ----
 const VILLES=[["Paris",2.3522,48.8566,11],["Marseille",5.3698,43.2965,12],["Lyon",4.8357,45.7640,12],["Toulouse",1.4442,43.6047,12],["Nice",7.2620,43.7034,12],["Nantes",-1.5534,47.2184,12],["Montpellier",3.8767,43.6108,12],["Strasbourg",7.7521,48.5734,12],["Bordeaux",-0.5792,44.8378,12],["Lille",3.0573,50.6292,12]];

 fetch("cartes/index.json").then(r=>{if(!r.ok)throw new Error();return r.text()}).then(t=>{
  let idx=JSON.parse(t.replace(/^\uFEFF/,""));if(!Array.isArray(idx))idx=[idx];FICHIERS=idx;
  maplibregl.addProtocol("multi",chargerTuile);
  const map=new maplibregl.Map({container:"map",style:style(),center:[2.3522,48.8566],zoom:11,maxZoom:19,attributionControl:false});
  document.getElementById("zin").onclick=()=>map.zoomIn();
  document.getElementById("zout").onclick=()=>map.zoomOut();
  map.on("load",()=>{aide.textContent="";aide.hidden=true});
  map.on("error",()=>{if(!aide.hidden)panne("La carte a rencontré un problème. Recharge la page pour réessayer.")});
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>map.setStyle(style()))}catch(e){}

  const chips=document.getElementById("chips");
  VILLES.forEach(([nom,lon,lat,z])=>{const b=document.createElement("button");b.type="button";b.textContent=nom;b.onclick=()=>map.flyTo({center:[lon,lat],zoom:z,duration:1200});chips.appendChild(b)});

  // La carte doit se redessiner quand on revient sur l'onglet
  document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.t==="carte")setTimeout(()=>map.resize(),0)}));

  // ---- Lieux (DATA.carte) : un repere par lieu qui a lat et lon ----
  const items=document.querySelectorAll("#l-carte .item");
  (DATA.carte||[]).forEach((p,i)=>{
   if(typeof p.lat!=="number"||typeof p.lon!=="number")return;
   const box=document.createElement("div");
   const t=document.createElement("strong");t.textContent=p.titre||"";box.appendChild(t);
   if(p.detail){const d=document.createElement("div");d.textContent=p.detail;box.appendChild(d)}
   if(p.src||p.maj){const s=document.createElement("div");s.className="pp";s.textContent=(p.src?"Source : "+p.src:"")+(p.maj?(p.src?" · ":"")+"vérifié le "+p.maj:"");box.appendChild(s)}
   const popup=new maplibregl.Popup({offset:16,maxWidth:"280px"}).setDOMContent(box);
   const el=document.createElement("button");el.type="button";el.className="pin";el.setAttribute("aria-label",(p.titre||"Lieu")+", voir la fiche");
   new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).setPopup(popup).addTo(map);
   if(items[i]){
    const go=document.createElement("button");go.type="button";go.className="go";go.textContent="Voir sur la carte";
    go.setAttribute("aria-label","Voir "+(p.titre||"ce lieu")+" sur la carte");
    go.onclick=()=>{window.scrollTo(0,0);map.flyTo({center:[p.lon,p.lat],zoom:Math.max(map.getZoom(),14)});popup.setLngLat([p.lon,p.lat]).addTo(map)};
    items[i].appendChild(go);
   }
  });
 }).catch(()=>{panne("La liste des cartes est introuvable. Recharge la page ; si ça continue, réessaie un peu plus tard.")});
})();
</script>
