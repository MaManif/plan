<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test carte</title>
<link rel="stylesheet" href="lib/maplibre-gl/maplibre-gl.css">
<style>
html,body{height:100%;margin:0;font:14px/1.4 system-ui,sans-serif;background:#fff;color:#111}
#map{position:absolute;inset:0}
#etat{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;
  background:rgba(255,255,255,.94);border:2px solid #111;border-radius:10px;padding:8px 10px;max-height:45%;overflow:auto;font-size:13px}
#etat b{display:block;margin-bottom:2px}
.ok{color:#0a7a2f}.ko{color:#b00020}
</style>
</head>
<body>
<div id="map"></div>
<div id="etat"><b>Test de la carte</b><div id="log">Démarrage…</div></div>

<script src="lib/maplibre-gl/maplibre-gl.js"></script>
<script src="lib/pmtiles/pmtiles.js"></script>
<script src="lib/basemaps/basemaps.js"></script>
<script>
const log = (msg, cls) => {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  document.getElementById("log").appendChild(d);
};
const abs = p => new URL(p, location.href).href;

// 1) La page est-elle servie par un vrai serveur ?
if (location.protocol === "file:") {
  log("Ouvre cette page depuis le site publié, pas depuis un fichier sur ton ordinateur.", "ko");
}

// 2) Les bibliothèques sont-elles bien chargées ?
log(typeof maplibregl !== "undefined" ? "MapLibre chargé" : "MapLibre ABSENT", typeof maplibregl !== "undefined" ? "ok" : "ko");
log(typeof pmtiles !== "undefined" ? "PMTiles chargé" : "PMTiles ABSENT", typeof pmtiles !== "undefined" ? "ok" : "ko");
log(typeof basemaps !== "undefined" ? "Style Protomaps chargé" : "Style Protomaps ABSENT", typeof basemaps !== "undefined" ? "ok" : "ko");

// 3) Le serveur accepte-t-il les requêtes partielles (indispensable) ?
const FICHIER = abs("cartes/nantes_01.pmtiles");
fetch(FICHIER, { headers: { Range: "bytes=0-99" } }).then(r => {
  const cr = r.headers.get("content-range");
  const ce = r.headers.get("content-encoding");
  if (r.status === 206) log("Requêtes partielles : OK (206)" + (cr ? " – " + cr : ""), "ok");
  else log("Requêtes partielles : NON (code " + r.status + "). La carte ne marchera pas.", "ko");
  if (ce) log("Attention : le serveur compresse le fichier (" + ce + "). Cela peut casser la carte.", "ko");
}).catch(e => log("Fichier de carte introuvable : " + e.message, "ko"));

// 4) La carte
try {
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  const style = {
    version: 8,
    glyphs: abs("assets/fonts/") + "{fontstack}/{range}.pbf",
    sprite: abs("assets/sprites/v4/light"),
    sources: {
      protomaps: {
        type: "vector",
        url: "pmtiles://" + FICHIER,
        attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>'
      }
    },
    layers: basemaps.layers("protomaps", basemaps.namedFlavor("light"), { lang: "fr" })
  };

  const map = new maplibregl.Map({
    container: "map",
    style: style,
    center: [-1.553, 47.218],   // Nantes
    zoom: 14,
    maxZoom: 19
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
  map.on("load", () => log("Carte affichée", "ok"));
  map.on("error", e => log("Erreur carte : " + (e.error && e.error.message ? e.error.message : "inconnue"), "ko"));
} catch (e) {
  log("Impossible de créer la carte : " + e.message, "ko");
}
</script>
</body>
</html>
